name: fresh_project
description: "Flutter Shift & Leave Management Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # فونت انلاین بدون نیاز به ذخیره فایل ttf در پروژه
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # تاریخ و تقویم شمسی
  shamsi_date: ^1.1.1

  # ذخیره‌سازی داده‌ها و مسیرها
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # اسکرین‌شات و ذخیره در گالری
  screenshot: ^3.0.0
  gal: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  # بخش assets مربوط به فونت حذف شد تا گیت‌هاب خطای عدم وجود فایل ندهد.
  # اگر تصویر یا دارایی دیگری دارید می‌توانید آن را تحت assets مجزا اضافه کنید.
