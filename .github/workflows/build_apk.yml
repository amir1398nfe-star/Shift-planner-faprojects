name: Build Flutter Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # در صورت نبود پوشه اندروید، فایل‌های نیتیو android را خودکار می‌سازد
      - name: Recreate Android Platform
        run: flutter create . --platforms=android

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Keystore for Build
        run: |
          keytool -genkey -v -keystore android/app/key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias key -storepass password -keypass password \
            -dname "CN=Amir, OU=Dev, O=App, L=Tehran, ST=Tehran, C=IR" || true

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
