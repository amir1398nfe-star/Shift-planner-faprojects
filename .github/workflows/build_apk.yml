name: Build Android APK for CafeBazaar

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Fresh Supported Project & Migrate Files
        run: |
          REPO_DIR=$(pwd)
          
          # ساخت یک پروژه کاملاً استاندارد و جدید که فلاتر آن را کاملاً تایید می‌کند
          flutter create -t app --org com.amir.shiftplanner --project-name shift_planner fresh_project
          
          # کپی کردن کدهای دارت شما به پروژه جدید
          rm -rf fresh_project/lib/*
          cp -r $REPO_DIR/lib/* fresh_project/lib/
          
          # کپی کردن pubspec.yaml اصلی شما
          cp $REPO_DIR/pubspec.yaml fresh_project/pubspec.yaml
          
          # کپی کردن پوشه assets در صورت وجود
          if [ -d "$REPO_DIR/assets" ]; then
            cp -r $REPO_DIR/assets fresh_project/assets
          fi

          # ورود به پوشه پروژه جدید برای ادامه مراحل
          cd fresh_project

          # اصلاح پکیج و نام کلاس‌های گالری
          sed -i -E 's/image_gallery_saver:.*/image_gallery_saver_plus: ^5.1.1/g' pubspec.yaml
          find lib/ -type f -name "*.dart" -exec sed -i 's/package:image_gallery_saver\/image_gallery_saver.dart/package:image_gallery_saver_plus\/image_gallery_saver_plus.dart/g' {} + || true
          find lib/ -type f -name "*.dart" -exec sed -i 's/ImageGallerySaver\./ImageGallerySaverPlus\./g' {} + || true

          # افزودن دسترسی‌های گالری به اندروید مانیفست
          sed -i '/<application/i \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>' android/app/src/main/AndroidManifest.xml

          # ساخت کلید امضا مخصوص کافه بازار (Release Keystore)
          keytool -genkeypair -alias shiftplanner -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore android/app/release.keystore \
            -dname "CN=Amir, OU=Dev, O=App, L=Tehran, S=Tehran, C=IR" \
            -storepass "AmirShift123" -keypass "AmirShift123"
          
          cat << 'EOF' > android/key.properties
          storePassword=AmirShift123
          keyPassword=AmirShift123
          keyAlias=shiftplanner
          storeFile=release.keystore
          EOF

          # تنظیمات امضای بیلد ریلیز در گریدل
          sed -i '/ buildTypes {/i \    signingConfigs {\n        release {\n            storeFile file(\x27release.keystore\x27)\n            storePassword \x27AmirShift123\x27\n            keyAlias \x27shiftplanner\x27\n            keyPassword \x27AmirShift123\x27\n        }\n    }' android/app/build.gradle
          sed -i '/ buildTypes {/,/ / s/minifyEnabled false/signingConfig signingConfigs.release\n        minifyEnabled false/' android/app/build.gradle

          # تنظیم سازگاری با Java 17
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' android/app/build.gradle || true
          sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" android/app/build.gradle || true

          # دریافت پکیج‌ها و ساخت فایل APK امضاشده نهایی
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

          # انتقال فایل خروجی به مسیر اصلی برای دانلود
          mkdir -p $REPO_DIR/build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk $REPO_DIR/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shift-planner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
